name: RELEASE

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        os:
        - macos-14
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
